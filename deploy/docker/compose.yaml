name: threadbear-trial
x-runtime: &runtime
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  user: "1000:1000"
  init: true
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}
services:
  runner:
    <<: *runtime
    image: monash/threadbear:codex-trial-v1
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile, target: runner}
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    ports: ["127.0.0.1:18797:8797"]
    volumes:
      - ${THREADBEAR_DATA:?}/runner:/data
      - ${THREADBEAR_DATA:?}/home:/home/node
      - ${THREADBEAR_DATA:?}/workspace:/workspace
      - ${THREADBEAR_DATA:?}/private/model-token:/run/secrets/model-token:ro
    tmpfs: ["/tmp:size=256m,mode=1777"]
    networks: [trial]
    depends_on:
      model-relay: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8797/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  model-relay:
    <<: *runtime
    image: monash/threadbear-model-relay:codex-trial-v1
    build: {context: ../.., dockerfile: deploy/docker/Dockerfile, target: relay}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    volumes:
      - ${THREADBEAR_DATA:?}/private/relay-config.json:/run/secrets/relay-config:ro
      - ${THREADBEAR_DATA:?}/relay-state:/state
    tmpfs: ["/tmp:size=8m,mode=1777"]
    networks: [trial, provider]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  trial: {}
  provider:
    external: true
    name: cliproxyapi_backend
